services:
  # OpenClaw runs as a SEPARATE, manually-managed system (not part of the content engine).
  # Disabled here so `docker compose up` won't start a second OpenClaw. To run it independently
  # see content_engine/SERVICES.md / the npm daemon (launchctl ai.openclaw.gateway). To re-enable
  # the containerized one, uncomment below (token comes from gitignored .docker/.env).
  # openclaw_daemon:
  #   image: ghcr.io/openclaw/openclaw:latest
  #   container_name: openclaw_core_watcher
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:18789:18789"
  #   environment:
  #     - WORKSPACE_DIR=/app/vault
  #     - INFERENCE_ROUTER=http://host.docker.internal:8000/v1
  #     - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
  #   volumes:
  #     - ~/Documents/AI_PRODUCER:/app/vault
  #   command: ["openclaw", "gateway", "run", "--allow-unconfigured"]
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  browser_scouter:
    image: mcr.microsoft.com/playwright:v1.44.0-focal  # Verified stable build tag
    container_name: scouter_browser_sandbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:30005:30005"
    environment:
      - SANDBOX_PROFILE_IDENTITY=isolated_studio_scout_mode
    volumes:
      - ~/Documents/AI_PRODUCER/02_CURRICULUM/raw_sources:/app/ingest_sink
    command: npx playwright run-server --port 30005

  open_webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui_cockpit
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - WEBUI_AUTH=false
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - OPENAI_API_KEY=local_omlx_key_override
    volumes:
      - open_webui_data:/app/backend/data  # Safe local volumes mount fallback
      - ~/Documents/AI_PRODUCER/02_CURRICULUM/compiled_wiki:/app/backend/vault:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # NOTE: The "production tracking" Postgres on port 5432 (consumed by
  # init_database.py / solocorn_media_bridge.py as PRODUCTION_DB_*) already runs as
  # a standalone container named `solocorn_db` started outside this compose project.
  # It is bound to 127.0.0.1 ONLY (not network-exposed) and uses a strong password
  # (in .env as PRODUCTION_DB_PASSWORD). Data is a host bind mount at
  # .docker/postgres_staging_data. Do not define a second postgres service here — it
  # will conflict on the port. To recreate (preserves data via the bind mount; export
  # PRODUCTION_DB_PASSWORD from .env first, do NOT revert to a default password):
  #   docker run -d --name solocorn_db --restart unless-stopped \
  #     -p 127.0.0.1:5432:5432 \
  #     -e POSTGRES_USER=postgres -e POSTGRES_DB=postgres \
  #     -e POSTGRES_PASSWORD=<from PRODUCTION_DB_PASSWORD in .docker/.env, never a default> \
  #     -v "$PWD/.docker/postgres_staging_data":/var/lib/postgresql/data postgres:15-alpine

  # Persistent Relational Storage Memory Layer for Graphify & Paperclip Corporate Logs
  paperclip_db:
    image: postgres:15-alpine
    container_name: paperclip_studio_database
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=${PAPERCLIP_DB_USER:?set PAPERCLIP_DB_USER in .docker/.env}
      - POSTGRES_PASSWORD=${PAPERCLIP_DB_PASSWORD:?set PAPERCLIP_DB_PASSWORD in .docker/.env}
      - POSTGRES_DB=${PAPERCLIP_DB_NAME:?set PAPERCLIP_DB_NAME in .docker/.env}
    volumes:
      - paperclip_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  open_webui_data:
  paperclip_db_data: