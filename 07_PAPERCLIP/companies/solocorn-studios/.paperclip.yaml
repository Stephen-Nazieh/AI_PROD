schema: paperclip/v1

# Agent adapters:
#   Option A (default): local_agent_runtime.py — Full ReAct loop with tool execution.
#     Best for multi-step agentic tasks (file edits, bash commands, git ops).
#   Option B: hybrid_agent_runtime.py — Best of both worlds.
#     Claude Code CLI THINKs (superior coding), local ToolExecutor ACTs (reliable).
#     Best for coding tasks that need file creation + execution.
#   Option C: claude-local — Claude Code CLI with local MLX LLM via proxy.
#     Best for code generation and reasoning. Limited tool execution in non-TTY.
#   Option D: openclaw_gateway — External OpenClaw proxy (single agent only).
#
# To switch an agent to hybrid mode, change its adapter to:
#   command: /Users/nazeera/Documents/AI_PRODUCER/env/bin/python3
#   args:
#     - /Users/nazeera/Documents/AI_PRODUCER/runtime/agents/hybrid_agent_runtime.py
#   env:
#     ANTHROPIC_BASE_URL: http://127.0.0.1:8003
#     ANTHROPIC_AUTH_TOKEN: local
#     ANTHROPIC_API_KEY: ""

defaults:
  # Default for NEW agents: hybrid (Claude THINK + local EXECUTE)
  # Override per-agent based on function (coding → hybrid, research → local)
  adapter:
    type: process
    config:
      command: /Users/nazeera/Documents/AI_PRODUCER/env/bin/python3
      args:
        - /Users/nazeera/Documents/AI_PRODUCER/runtime/agents/hybrid_agent_runtime.py
      timeoutSec: 3600
      env:
        ANTHROPIC_BASE_URL: http://127.0.0.1:8003
        ANTHROPIC_AUTH_TOKEN: local
        ANTHROPIC_API_KEY: ""
  runtime:
    heartbeat:
      enabled: false
      wakeOnDemand: true

